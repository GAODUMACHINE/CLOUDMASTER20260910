[project]
name = "cloudmaster"
version = "0.1.0"
description = "面向18-25岁青年的AI心理陪伴与疏导助手（不做诊断/用药建议）"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pydantic-settings>=2",
    "python-dotenv>=1",
    "langgraph-checkpoint-sqlite>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "safety: 危机场景回归，失败禁止合并",
]