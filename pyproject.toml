[build-system]
# 显式声明构建后端：新环境的隔离构建会用最新 setuptools，不声明则行为随环境漂移。
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightcloudmaster"
version = "2.1.0"
description = "面向18-25岁青年的AI心理陪伴与疏导助手（不做诊断/用药建议）"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    # 生产 `pip install -e .` 必须可直接部署（deploy/bootstrap.sh 依赖这一点）。
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pydantic-settings>=2",
    "langgraph-checkpoint-sqlite>=2",
]

# 仓库是扁平布局（lightcloudmaster/ + frontend/ + deploy/ + mobile/），setuptools 对
# 多顶层目录拒绝自动猜测，只打包 lightcloudmaster；scripts/ 经
# `python -m scripts.run_jobs` 从仓库根目录运行，无需入包。
[tool.setuptools.packages.find]
include = ["lightcloudmaster*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
