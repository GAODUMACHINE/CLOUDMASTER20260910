<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudMaster · 云端陪伴</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 class="brand">CloudMaster<span class="dot"> · </span>云端陪伴</h1>
    <p class="brand-sub">一处可以放松倾诉的云端陪伴</p>
    <p class="ai-note">内容由 AI 生成 · 仅供陪伴参考，不作心理/医疗诊断</p>
  </header>

  <div id="disclosure" class="disclosure hidden">
    <div class="dlg">
      <p>本页面内容由 AI 生成。它是一位陪伴助手，不是真人也不是医生：不做诊断、不提供医疗建议；紧急风险会升级给人工审核台。</p>
      <button id="disclosureOk" class="primary">我知道了</button>
    </div>
  </div>

  <main>
    <section id="registerPanel" class="card panel hidden">
      <h2>开始前，请确认你的年龄</h2>
      <p class="privacy">匿名使用：我们不索要真实姓名、照片或联系方式。</p>
      <label class="field">年龄
        <input id="age" type="number" min="0" max="100" placeholder="请输入年龄">
      </label>
      <p id="ageReject" class="reject hidden">未满 14 岁无法使用：本产品不处理 <14 岁数据。</p>
      <div id="guardianRow" class="guardian-row hidden">
        <label><input id="guardianBox" type="checkbox"> 我确认使用期间有监护人/家长在场或在旁</label>
      </div>
      <button id="regBtn" class="primary">开始陪伴</button>
      <p id="chatError" class="error"></p>
    </section>

    <section id="chatPanel" class="card panel hidden">
      <div id="crisisBanner" class="crisis hidden">
        <h3 id="crisisTitle"></h3>
        <p id="crisisText"></p>
      </div>
      <div id="chatMessages" class="messages" aria-live="polite"></div>
      <div id="typing" class="typing"><span class="td"></span><span class="td"></span><span class="td"></span>正在输入…</div>
      <div class="input-row">
        <input id="input" type="text" placeholder="说说你现在的心情…" aria-label="输入你的话">
        <button id="sendBtn" class="primary">发送</button>
      </div>
      <p class="privacy micro">匿名使用 · 不记录真实身份 · 你的状态会按风险分级处理</p>
    </section>
  </main>

  <footer class="foot">CloudMaster 云端陪伴 · 页面内容 AI 生成 · 紧急风险走人工审核 · 提供来源虚构图谱，不提供未审核热线</footer>

  <script src="../common/api.js" defer></script>
</body>
</html>
