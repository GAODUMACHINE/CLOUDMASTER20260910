# LightCloudMaster 反向代理——由 deploy/bootstrap.sh 安装到
# /etc/nginx/sites-available/lightcloudmaster（符号链接进 sites-enabled）。
#
# 要点：/api/chat/stream 是真 token SSE，nginx 默认会攒满 buffer
# 再转发——不关 proxy_buffering，流式直接退化回「整段伪流式」。其余头只做
# 透传；令牌走 Authorization 头、匿名 ID 不进 URL，默认 access log 不记头，
# 「令牌/匿名 ID 不进日志」红线自持（对话原文在请求体里，同样不进 URL/日志）。

# ---- 80：ACME challenge + 全量跳 HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name lightcloudmaster.top www.lightcloudmaster.top;

    # webroot challenge（签发与续期都走这里，/var/www/html 由 bootstrap 创建）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.lightcloudmaster.top$request_uri;
    }
}

# ---- 443：唯一对外入口 ----
server {
    listen 443 ssl http2;   # 兼容 nginx 1.18（Ubuntu 22.04）；1.25+ 会提示弃用写法，功能不变
    listen [::]:443 ssl http2;
    server_name www.lightcloudmaster.top;

    ssl_certificate     /etc/letsencrypt/live/lightcloudmaster.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lightcloudmaster.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 注册页涉及未成年人信息，全站 HTTPS 是硬前提；HSTS 半年（证书 90 天自动续）
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 有意不加 CSP：前端为内联脚本/样式的单页，收紧须连同前端改造，另行处理

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- SSE：不攒 token、长回复不断流 ----
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
